- 500
- 2000
dec_rung_n_hidden:
- 1
- 1
decode_layer_dims:
- 2000
- 500
do_progressive_training: true
do_test_during_training: true
do_vis_cluster_means: false
do_vis_conf_mat: true
do_vis_examples_per_cluster: true
do_vis_latent_code_traversal: false
do_vis_n_samples_per_cluster: true
